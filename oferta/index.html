<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Resina Extreme | Pague só na entrega</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700&display=swap"></noscript>
<style>
:root{--ink:#0b1f3a;--cy:#19c3d6;--go:#15803d;--goD:#0b5a28;--soft:#eef6f8;--line:#d3e3e8;--mute:#47607a;--warn:#fff4d6;
--display:"Bricolage Grotesque",Arial,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);color:var(--ink);line-height:1.55;font-size:18px;background:#fff}
img{max-width:100%;display:block}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--display);line-height:1.1;letter-spacing:-.02em}
h2{font-size:clamp(28px,5vw,40px);font-weight:800;margin-bottom:10px}
section{padding:56px 0}
.center{text-align:center}
.lead{color:var(--mute);max-width:40em}
.center .lead{margin:0 auto}
.bar{background:var(--go);color:#fff;text-align:center;font-weight:800;font-size:clamp(18px,4.8vw,28px);line-height:1.15;padding:15px 12px}
.dark{background:linear-gradient(160deg,#071a33 0%,#0b2f5c 55%,#0d4a8a 100%);color:#fff}
.dark .lead{color:#cfe0f2}
.hero{text-align:center;padding:46px 0 52px}
.hero .wrap{max-width:780px}
.hero h1{font-size:clamp(30px,6vw,48px);font-weight:800}
.hero p.sub{font-size:19px;margin:16px auto 0;max-width:36em;color:#cfe0f2}
.check{width:84px;height:84px;border-radius:50%;background:var(--go);border:4px solid #fff;display:grid;place-items:center;margin:0 auto 18px;font-size:44px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.alert.tall{text-align:left;margin:30px auto 0;max-width:640px}
.pitch{background:#050b14;color:#fff;padding:52px 0 56px}
.pitch .lead{color:#cfe0f2}
.note{display:inline-block;background:var(--cy);color:var(--ink);border-radius:12px;padding:10px 16px;font-weight:700;margin-bottom:20px;font-size:16px}
a.shot{display:block;max-width:460px;margin:28px auto 0;border-radius:24px;overflow:hidden;border:4px solid #ffb800;box-shadow:0 12px 36px rgba(0,0,0,.55)}
.shot img{width:100%;height:auto}
.shot:hover{border-color:#fff}
.btn{display:inline-block;background:var(--go);color:#fff;font:800 19px var(--body);text-decoration:none;text-align:center;border:0;border-radius:14px;padding:18px 30px;cursor:pointer;box-shadow:0 5px 0 var(--goD);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(2px);box-shadow:0 3px 0 var(--goD)}
.btn:focus-visible,a:focus-visible{outline:3px solid var(--cy);outline-offset:3px}
.btn small{display:block;font:700 14px var(--body);margin-top:2px}
.desc{max-width:42em;margin:0 auto;font-size:19px;color:var(--mute)}
.feats{display:grid;gap:14px;margin-top:26px;text-align:left}
@media(min-width:760px){.feats{grid-template-columns:repeat(3,1fr)}}
.feat{background:var(--soft);border-radius:18px;padding:22px}
.feat .ic{font-size:32px;line-height:1;margin-bottom:8px}
.feat h3{font-size:20px;margin-bottom:4px}
.feat p{color:var(--mute);font-size:16px}
.kitgrid{display:grid;gap:18px;margin-top:30px}
@media(min-width:800px){.kitgrid{grid-template-columns:repeat(3,1fr)}}
.kit{background:#fff;color:var(--ink);border:3px solid var(--line);border-radius:22px;padding:28px 22px;text-align:center;position:relative;display:flex;flex-direction:column;gap:6px}
.kit.top{border-color:#ffb800}
@media(min-width:800px){.kit.top{transform:scale(1.04)}}
.badge{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#ffb800,#ff7a00);color:#3a2300;font-weight:800;font-size:14px;padding:5px 16px;border-radius:99px;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.kit h3{font-size:24px}
.kit .p{font:800 42px var(--display)}
.kit .each{color:var(--mute);font-weight:600}
.kit .save{color:var(--go);font-weight:800;min-height:1.5em}
.kit .pay{font-weight:600;font-size:14px;color:var(--go)}
.kit .btn{margin-top:10px;padding:16px 14px;font-size:17px}
.alert{background:var(--warn);border:3px solid #ffb800;border-left-width:10px;border-radius:18px;padding:20px 24px;color:#4a3a00;max-width:760px;margin:0 auto}
.alert h3{font-size:22px;color:#8a4b00;margin-bottom:6px}
.alert ul{padding-left:20px}
.alert li{margin:8px 0}
.decline{text-align:center;margin-top:34px}
.decline a{color:#cfe0f2;font-weight:600}
footer{background:#061426;border-top:3px solid var(--cy);color:#b9cde0;text-align:center;padding:26px 0;font-size:14px}
.wafloat{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;align-items:center;gap:8px;background:#0e8040;color:#fff;font:800 16px var(--body);text-decoration:none;padding:12px 18px 12px 14px;border-radius:99px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* Fundo preto somente na área do agradecimento */
.hero.dark{background:#000}
</style>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18511906715"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'AW-18511906715');
</script>
</head>
<body>

<div class="bar" id="topbar"></div>

<header class="hero dark">
  <div class="wrap">
    <div class="check" aria-hidden="true">✓</div>
    <h1 id="thanksTitle"></h1>
    <p class="sub" id="thanksSub"></p>
  </div>
</header>

<section class="pitch">
  <div class="wrap center">
    <h2 id="headline"></h2>
    <p class="lead" id="subheadline"></p>
    <a class="shot" id="shot" href="#kits" hidden></a>
    <p style="margin-top:28px"><a class="btn" href="#kits" id="ctaHero"></a></p>
  </div>
</section>

<main>
<section id="descSec" hidden>
  <div class="wrap center">
    <h2 id="descTitle"></h2>
    <p class="desc" id="desc"></p>
    <div class="feats" id="feats"></div>
  </div>
</section>

<section class="dark" id="kits">
  <div class="wrap center">
    <h2 id="kitsTitle"></h2>
    <p class="lead" id="kitsLead"></p>
    <div class="kitgrid" id="kitgrid"></div>

    <div class="alert tall">
      <h3 id="alertTitle"></h3>
      <ul id="alertList"></ul>
    </div>

    <p class="decline"><a id="decline" href="/obrigado"></a></p>
  </div>
</section>
</main>

<footer><div class="wrap" id="footer"></div></footer>

<a class="wafloat" id="waFloat" target="_blank" rel="noopener" aria-label="Falar com o suporte no WhatsApp">💬 <span id="waText"></span></a>

<script>
/* =====================================================================
   EDITE SÓ AQUI. Troque textos, preços, links e imagem.
   Campos vazios ("" ou []) fazem a seção correspondente sumir.
   ===================================================================== */
const CONFIG = {
  produto: "Resina Extreme",
  faixaTopo: "🚚 Pague só quando receber",
  tituloObrigado: "Obrigado! Seu pedido está agendado",
  subObrigado: "Recebemos o seu pedido dos óculos e ele já está na fila de entrega. Você não pagou nada agora: o pagamento é feito somente quando o produto chegar na sua casa.",
  tituloAtencao: "⚠️ Para receber sem problemas",
  atencao: [
    "Esteja em casa, ou deixe alguém no endereço, no dia da entrega para receber o pedido e pagar.",
    "O entregador entrará em contato pelo WhatsApp para combinar a entrega. Fique atento às notificações do seu celular.",
    "Tenha o pagamento do pedido em mãos na hora de receber.",
    "Confira se o endereço informado está completo, para o entregador chegar sem atrasos."
  ],
  titulo: "Aproveite e leve também a Resina Extreme",
  subtitulo: "Peça também e pague somente quando receber em casa, assim como no seu pedido dos óculos.",
  botao: "VER AS OPÇÕES",

  // --- Sobre o produto (preencha com informações reais; vazio = a seção some) ---
  imagem: "/oferta/resina.webp",
  tituloDescricao: "Conheça a Resina Extreme",
  descricao: "A Resina Extreme é um finalizador auto brilho em frasco de 500 ml, usado para dar o acabamento final e realçar o brilho do carro. Leia atentamente o rótulo antes de usar o produto.",
  beneficios: [
    { icone: "✨", titulo: "Brilho no acabamento", texto: "Finalizador auto brilho, para dar o toque final e realçar o brilho do carro." },
    { icone: "🧴", titulo: "Frasco de 500 ml", texto: "Tamanho prático para guardar e usar quando precisar." },
    { icone: "💵", titulo: "Pague só na entrega", texto: "Peça agora e pague somente quando o produto chegar na sua casa." }
  ],

  // --- Ofertas (cada uma leva ao checkout da Logzz) ---
  tituloKits: "Escolha a quantidade",
  subKits: "Todas as opções com pagamento só na entrega.",
  moeda: "R$",
  kits: [
    { nome: "1 unidade", qtd: 1, preco: 99.99, destaque: "", link: "https://entrega.logzz.com.br/pay/mem70xkyy/1-por-9999-entrega-garantida" },
    { nome: "2 unidades", qtd: 2, preco: 124.99, destaque: "", link: "https://entrega.logzz.com.br/pay/mem70xkyy/2-unidades-12499" },
    { nome: "3 unidades", qtd: 3, preco: 147.00, destaque: "MELHOR PREÇO", link: "https://entrega.logzz.com.br/pay/mem70xkyy/kqzkr-3-por-147" }
  ],
  botaoKit: "Quero este e pagar na entrega",
  textoRecusa: "Não, obrigado. Quero seguir sem essa oferta.",
  linkRecusa: "/obrigado",

  whatsappLink: "https://wa.me/5521990800157?text=Ol%C3%A1%2C%20tenho%20algumas%20duvidas%20sobre%20o%20produto%20e%20a%20entrega.%20Pode%20me%20ajudar%3F",
  textoWhatsapp: "Dúvidas?",
  rodape: "© 2026 Óculos 2V PRO. Todos os direitos reservados."
};
/* ===================================================================== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = v => CONFIG.moeda + " " + v.toFixed(2).replace(".", ",");

document.title = CONFIG.produto + " | Pague só na entrega";
$("topbar").textContent = CONFIG.faixaTopo;
$("thanksTitle").textContent = CONFIG.tituloObrigado;
$("thanksSub").textContent = CONFIG.subObrigado;
$("alertTitle").textContent = CONFIG.tituloAtencao;
$("headline").textContent = CONFIG.titulo;
$("subheadline").textContent = CONFIG.subtitulo;
$("ctaHero").innerHTML = esc(CONFIG.botao) + "<small>Pague só quando receber</small>";

if (CONFIG.imagem) {
  $("shot").innerHTML = '<img src="' + esc(CONFIG.imagem) + '" alt="' + esc(CONFIG.produto) + '" decoding="async">';
  $("shot").hidden = false;
}

if (CONFIG.descricao || CONFIG.beneficios.length) {
  $("descSec").hidden = false;
  $("descTitle").textContent = CONFIG.tituloDescricao;
  $("desc").textContent = CONFIG.descricao;
  $("desc").hidden = !CONFIG.descricao;
  $("feats").innerHTML = CONFIG.beneficios.map(b =>
    '<div class="feat"><div class="ic" aria-hidden="true">' + esc(b.icone) + "</div><h3>" + esc(b.titulo) + "</h3><p>" + esc(b.texto) + "</p></div>"
  ).join("");
}

$("kitsTitle").textContent = CONFIG.tituloKits;
$("kitsLead").textContent = CONFIG.subKits;
const base = CONFIG.kits[0].preco / CONFIG.kits[0].qtd;

$("kitgrid").innerHTML = CONFIG.kits.map(k => {
  const cada = Math.round(k.preco / k.qtd * 100) / 100;
  const eco = base * k.qtd - k.preco;
  return '<div class="kit' + (k.destaque ? " top" : "") + '">' +
    (k.destaque ? '<span class="badge">' + esc(k.destaque) + "</span>" : "") +
    "<h3>" + esc(k.nome) + '</h3><div class="p">' + fmt(k.preco) + '</div>' +
    '<div class="each">' + (k.qtd > 1 ? "cerca de " + fmt(cada) + " cada" : "&nbsp;") + '</div>' +
    '<div class="save">' + (eco > 0.005 ? "Você economiza " + fmt(eco) : "&nbsp;") + '</div>' +
    '<div class="pay">Pague só na entrega</div><a class="btn" href="' + esc(k.link) + '">' + esc(CONFIG.botaoKit) + "</a></div>";
}).join("");

$("decline").textContent = CONFIG.textoRecusa;
$("decline").href = CONFIG.linkRecusa;
$("alertList").innerHTML = CONFIG.atencao.map(t => "<li>" + esc(t) + "</li>").join("");
$("footer").textContent = CONFIG.rodape;
$("waFloat").href = CONFIG.whatsappLink;
$("waText").textContent = CONFIG.textoWhatsapp;
</script>
</body>
</html>
