<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Óculos Inteligente | Pague só na entrega</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1f3a;--cy:#19c3d6;--go:#16a34a;--goD:#0e7a35;--soft:#eef6f8;--line:#d3e3e8;--mute:#47607a;--warn:#fff4d6;
--display:"Bricolage Grotesque","Arial Black",Arial,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);color:var(--ink);line-height:1.55;font-size:18px;padding-bottom:80px;background:#fff}
img,video{max-width:100%;display:block}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--display);line-height:1.1;letter-spacing:-.02em}
h2{font-size:clamp(28px,5vw,40px);font-weight:800;margin-bottom:10px}
section{padding:60px 0}
.center{text-align:center}
.lead{color:var(--mute);max-width:40em}
.center .lead{margin:0 auto}
.bar{background:var(--go);color:#fff;text-align:center;font-weight:800;font-size:clamp(20px,5.2vw,32px);line-height:1.15;padding:16px 12px;letter-spacing:.01em}
.hero{background:linear-gradient(160deg,#071a33 0%,#0b2f5c 55%,#0d4a8a 100%);color:#fff;padding:44px 0 56px}
.hero .wrap{max-width:780px;text-align:center}
.hero h1{font-size:clamp(28px,5.6vw,46px);font-weight:800}
.hero p.sub{font-size:19px;margin:16px auto 0;max-width:36em;color:#cfe0f2}
.stamp{display:inline-block;background:var(--cy);color:var(--ink);border-radius:12px;padding:10px 16px;font-weight:700;margin:26px 0 18px}
.stamp b{color:var(--ink)}
.btn{display:inline-block;background:var(--go);color:#fff;font:800 19px var(--body);text-decoration:none;text-align:center;border:0;border-radius:14px;padding:18px 30px;cursor:pointer;box-shadow:0 5px 0 var(--goD);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(2px);box-shadow:0 3px 0 var(--goD)}
.btn:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn small{display:block;font:600 13px var(--body);opacity:.92;margin-top:2px}
.ticks{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;margin-top:18px;font-weight:600;font-size:15px}
.herovis{position:relative;max-width:520px;margin:28px auto 0}
.heroimg{border-radius:26px;overflow:hidden;border:4px solid var(--cy);background:#fff}
.seal{position:absolute;right:-6px;top:-18px;width:112px;height:112px;border-radius:50%;background:linear-gradient(135deg,#ffb800,#ff7a00);color:#3a2300;display:grid;place-items:center;text-align:center;font:800 15px/1.1 var(--display);transform:rotate(12deg);box-shadow:0 6px 18px rgba(0,0,0,.35);border:3px solid #fff}
.trust{background:var(--cy);color:var(--ink);display:flex;flex-wrap:wrap;justify-content:center;gap:8px 28px;padding:14px 16px;font-weight:800;font-size:15px}
.dark{background:linear-gradient(160deg,#071a33 0%,#0b2f5c 60%,#0d4a8a 100%);color:#fff}
.dark .lead{color:#b9cde0}
.rseal{display:grid;place-items:center;text-align:center;border-radius:50%;width:128px;height:128px;flex:none;font:800 15px/1.1 var(--display);border:4px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.rseal b{display:block;font-size:44px;line-height:1}
.gsvg{width:200px;height:200px;margin:0 auto;position:relative;z-index:1}
.ribbon{display:inline-block;position:relative;z-index:2;margin:-22px auto 18px;background:linear-gradient(135deg,#ffe27a,#ff9a00);color:#3a2300;font:800 18px var(--display);letter-spacing:.03em;padding:10px 40px;clip-path:polygon(0 0,100% 0,calc(100% - 16px) 50%,100% 100%,0 100%,16px 50%)}
.eseal{background:linear-gradient(135deg,#19c3d6,#0d8fb0);color:#fff}
.expert{display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap;background:var(--soft);border-radius:20px;padding:24px;max-width:760px;margin:0 auto;text-align:left}
.ctaw{margin-top:30px;text-align:center}
.urg{margin-top:16px;background:#d92d20;color:#fff;border-radius:14px;padding:14px 16px;text-align:center;font-weight:800;line-height:1.3}
.urg div:first-child{font-size:19px}
.urg div+div{margin-top:6px;font-size:17px;color:#ffe27a}
.alert{background:var(--warn);border:3px solid #ffb800;border-left-width:10px;border-radius:18px;padding:22px 24px;color:#4a3a00;text-align:left;margin:0 auto 38px;max-width:760px}
.alert h3{font-size:24px;color:#8a4b00;margin-bottom:8px}
.alert li{margin:6px 0 6px 20px}
.alert p{margin-top:10px;font-weight:700}
.heroimg img{width:100%;aspect-ratio:1;object-fit:cover}
.cod{background:linear-gradient(160deg,#071a33 0%,#0b2f5c 60%,#0d4a8a 100%);color:#fff}
.cod h2{color:#fff}
.cod .lead{color:#b9cde0}
.steps{display:grid;gap:14px;margin-top:26px;counter-reset:s}
@media(min-width:760px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{border:2px solid #264766;border-radius:18px;padding:22px;counter-increment:s}
.step::before{content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--cy);color:var(--ink);font:800 19px var(--display);margin-bottom:10px}
.step h3{font-size:20px;margin-bottom:4px}
.step p{color:#b9cde0}
.note{background:var(--warn);color:#4a3a00;border-radius:14px;padding:16px 18px;margin-top:22px;font-size:15px}
.feats{display:grid;gap:14px;margin-top:26px;text-align:left}
@media(min-width:760px){.feats{grid-template-columns:repeat(3,1fr)}}
.feat{background:var(--soft);border-radius:18px;padding:22px}
.feat .ic{font-size:32px;line-height:1;margin-bottom:8px}
.feat h3{font-size:20px;margin-bottom:4px}
.feat p{color:var(--mute);font-size:16px}
.expect{margin-top:22px;border:2px solid var(--ink);border-radius:18px;padding:20px 22px;text-align:left}
.expect h3{font-size:22px;margin-bottom:8px}
.expect li{margin:6px 0 6px 20px}
.media{display:grid;gap:16px;margin-top:26px}
@media(min-width:700px){.media{grid-template-columns:repeat(2,1fr)}}
.media img{border-radius:18px;width:100%;border:2px solid var(--line)}
.vids{display:grid;gap:14px;margin-top:26px;grid-template-columns:repeat(2,1fr)}
@media(min-width:800px){.vids{grid-template-columns:repeat(4,1fr)}}
.vids video{width:100%;aspect-ratio:9/16;object-fit:cover;background:#000;border-radius:16px}
.fit{display:grid;gap:22px;margin-top:24px;align-items:center}
@media(min-width:800px){.fit{grid-template-columns:1fr 1fr}}
.fit ul{list-style:none;padding:0;display:grid;gap:10px}
.fit li::before{content:"✔ ";color:var(--go);font-weight:800}
.fit .no{background:var(--soft);border-radius:14px;padding:16px;margin-top:16px;font-size:15px}
.fit img{border-radius:18px;width:100%}
.kitgrid{display:grid;gap:18px;margin-top:28px}
@media(min-width:800px){.kitgrid{grid-template-columns:repeat(3,1fr)}}
.kit{color:var(--ink);background:#fff;border:3px solid var(--line);border-radius:22px;padding:26px 22px;text-align:center;position:relative;display:flex;flex-direction:column;gap:6px}
.kit.top{border-color:#ffb800}
@media(min-width:800px){.kit.top{transform:scale(1.04)}}
.kit .badge{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#ffb800,#ff7a00);color:#3a2300;font-weight:800;font-size:14px;padding:5px 16px;border-radius:99px;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.kit h3{font-size:24px}
.kit .p{font:800 40px var(--display)}
.kit .old{text-decoration:line-through;color:var(--mute);min-height:1.4em}
.kit .btn{margin-top:10px;padding:16px 14px;font-size:17px}
.kit .pay{font-weight:600;font-size:14px;color:var(--go)}
.quotes{display:grid;gap:16px;margin-top:26px}
@media(min-width:800px){.quotes{grid-template-columns:repeat(3,1fr)}}
.quote{border:2px solid var(--line);border-radius:18px;padding:20px}
.quote b{display:block;margin-top:10px;font-size:15px}
.guar{background:linear-gradient(160deg,#071a33 0%,#0b2f5c 60%,#0d4a8a 100%);color:#fff;border-radius:24px;padding:38px 26px}
.guar .lead{color:#b9cde0}
details{border-bottom:2px solid var(--line);padding:16px 0}
summary{font-weight:700;font-size:18px;cursor:pointer}
details p{margin-top:8px;color:var(--mute)}
.support{padding:44px 0}
.support h2{font-size:clamp(24px,4.5vw,34px)}
.btn.wa{background:#1faa59;box-shadow:0 5px 0 #14733c;margin-top:16px}
.btn.wa:hover{box-shadow:0 3px 0 #14733c}
footer{background:#061426;border-top:3px solid var(--cy);color:#b9cde0;padding:30px 0;text-align:center;font-size:14px}
footer a{color:#fff}
.wafloat{position:fixed;right:14px;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;align-items:center;gap:8px;background:#25d366;color:#fff;font:800 16px var(--body);text-decoration:none;padding:12px 18px 12px 14px;border-radius:99px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.wafloat:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.sticky{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid var(--ink);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:9}
.sticky .t{font-weight:800;line-height:1.2;font-size:15px}
.sticky .t span{display:block;font-weight:600;color:var(--mute);font-size:13px}
.sticky .btn{padding:13px 18px;font-size:16px;white-space:nowrap}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="bar" id="topbar"></div>

<header class="hero">
  <div class="wrap">
    <h1 id="headline"></h1>
    <p class="sub" id="subheadline"></p>
    <div class="herovis"><div class="heroimg" id="heroimg"></div><div class="seal" id="seal"></div></div>
