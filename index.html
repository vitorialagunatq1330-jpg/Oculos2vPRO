<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Óculos Inteligente | Pague só na entrega</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1f3a;--cy:#19c3d6;--go:#16a34a;--goD:#0e7a35;--soft:#eef6f8;--line:#d3e3e8;--mute:#47607a;--warn:#fff4d6;
--display:"Bricolage Grotesque","Arial Black",Arial,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);color:var(--ink);line-height:1.55;font-size:18px;padding-bottom:80px;background:#fff}
img,video{max-width:100%;display:block}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--display);line-height:1.1;letter-spacing:-.02em}
h2{font-size:clamp(28px,5vw,40px);font-weight:800;margin-bottom:10px}
section{padding:60px 0}
.center{text-align:center}
.lead{color:var(--mute);max-width:40em}
.center .lead{margin:0 auto}
.bar{background:var(--go);color:#fff;text-align:center;font-weight:800;font-size:15px;padding:10px 12px;letter-spacing:.01em}
.hero{background:linear-gradient(180deg,var(--soft),#fff);padding:40px 0 52px}
.hero .wrap{display:grid;gap:30px;align-items:center}
@media(min-width:820px){.hero .wrap{grid-template-columns:1.05fr .95fr}}
.hero h1{font-size:clamp(34px,7vw,58px);font-weight:800}
.hero p.sub{font-size:19px;margin:16px 0 22px;color:var(--mute)}
.stamp{display:inline-block;background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;margin-bottom:18px}
.stamp b{color:var(--cy)}
.btn{display:inline-block;background:var(--go);color:#fff;font:800 19px var(--body);text-decoration:none;text-align:center;border:0;border-radius:14px;padding:18px 30px;cursor:pointer;box-shadow:0 5px 0 var(--goD);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(2px);box-shadow:0 3px 0 var(--goD)}
.btn:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn small{display:block;font:600 13px var(--body);opacity:.92;margin-top:2px}
.ticks{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:16px;font-weight:600;font-size:15px}
.heroimg{border-radius:26px;overflow:hidden;border:4px solid var(--ink);background:#fff}
.heroimg img{width:100%;aspect-ratio:1;object-fit:cover}
.cod{background:var(--ink);color:#fff}
.cod h2{color:#fff}
.cod .lead{color:#b9cde0}
.steps{display:grid;gap:14px;margin-top:26px;counter-reset:s}
@media(min-width:760px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{border:2px solid #264766;border-radius:18px;padding:22px;counter-increment:s}
.step::before{content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--cy);color:var(--ink);font:800 19px var(--display);margin-bottom:10px}
.step h3{font-size:20px;margin-bottom:4px}
.step p{color:#b9cde0}
.note{background:var(--warn);color:#4a3a00;border-radius:14px;padding:16px 18px;margin-top:22px;font-size:15px}
.feats{display:grid;gap:14px;margin-top:26px;text-align:left}
@media(min-width:760px){.feats{grid-template-columns:repeat(3,1fr)}}
.feat{background:var(--soft);border-radius:18px;padding:22px}
.feat .ic{font-size:32px;line-height:1;margin-bottom:8px}
.feat h3{font-size:20px;margin-bottom:4px}
.feat p{color:var(--mute);font-size:16px}
.expect{margin-top:22px;border:2px solid var(--ink);border-radius:18px;padding:20px 22px;text-align:left}
.expect h3{font-size:22px;margin-bottom:8px}
.expect li{margin:6px 0 6px 20px}
.media{display:grid;gap:16px;margin-top:26px}
@media(min-width:700px){.media{grid-template-columns:repeat(2,1fr)}}
.media img{border-radius:18px;width:100%;border:2px solid var(--line)}
.vids{display:grid;gap:14px;margin-top:26px;grid-template-columns:repeat(2,1fr)}
@media(min-width:800px){.vids{grid-template-columns:repeat(4,1fr)}}
.vids video{width:100%;aspect-ratio:9/16;object-fit:cover;background:#000;border-radius:16px}
.fit{display:grid;gap:22px;margin-top:24px;align-items:center}
@media(min-width:800px){.fit{grid-template-columns:1fr 1fr}}
.fit ul{list-style:none;padding:0;display:grid;gap:10px}
.fit li::before{content:"✔ ";color:var(--go);font-weight:800}
.fit .no{background:var(--soft);border-radius:14px;padding:16px;margin-top:16px;font-size:15px}
.fit img{border-radius:18px;width:100%}
.kits{background:var(--soft)}
.kitgrid{display:grid;gap:18px;margin-top:28px}
@media(min-width:800px){.kitgrid{grid-template-columns:repeat(3,1fr)}}
.kit{background:#fff;border:3px solid var(--line);border-radius:22px;padding:26px 22px;text-align:center;position:relative;display:flex;flex-direction:column;gap:6px}
.kit.top{border-color:var(--ink)}
.kit .badge{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;font-size:13px;padding:4px 14px;border-radius:99px;white-space:nowrap}
.kit h3{font-size:24px}
.kit .p{font:800 40px var(--display)}
.kit .old{text-decoration:line-through;color:var(--mute);min-height:1.4em}
.kit .btn{margin-top:10px;padding:16px 14px;font-size:17px}
.kit .pay{font-weight:600;font-size:14px;color:var(--go)}
.quotes{display:grid;gap:16px;margin-top:26px}
@media(min-width:800px){.quotes{grid-template-columns:repeat(3,1fr)}}
.quote{border:2px solid var(--line);border-radius:18px;padding:20px}
.quote b{display:block;margin-top:10px;font-size:15px}
.guar{background:var(--soft);border-radius:24px;padding:34px 26px}
details{border-bottom:2px solid var(--line);padding:16px 0}
summary{font-weight:700;font-size:18px;cursor:pointer}
details p{margin-top:8px;color:var(--mute)}
.support{background:var(--soft);padding:44px 0}
.support h2{font-size:clamp(24px,4.5vw,34px)}
.btn.wa{background:#1faa59;box-shadow:0 5px 0 #14733c;margin-top:16px}
.btn.wa:hover{box-shadow:0 3px 0 #14733c}
footer{background:var(--ink);color:#b9cde0;padding:30px 0;text-align:center;font-size:14px}
footer a{color:#fff}
.sticky{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid var(--ink);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:9}
.sticky .t{font-weight:800;line-height:1.2;font-size:15px}
.sticky .t span{display:block;font-weight:600;color:var(--mute);font-size:13px}
.sticky .btn{padding:13px 18px;font-size:16px;white-space:nowrap}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="bar" id="topbar"></div>

<header class="hero">
  <div class="wrap">
    <div>
      <div class="stamp" id="stamp"></div>
      <h1 id="headline"></h1>
      <p class="sub" id="subheadline"></p>
      <a class="btn" id="ctaHero"></a>
      <div class="ticks" id="ticks"></div>
    </div>
    <div class="heroimg" id="heroimg"></div>
  </div>
</header>

<section id="prodSec">
  <div class="wrap center">
    <h2 id="prodTitle"></h2>
    <p class="lead" id="prodLead"></p>
    <div class="feats" id="feats"></div>
    <div class="expect">
      <h3 id="expTitle"></h3>
      <ul id="expList"></ul>
      <p id="expNote" style="margin-top:10px;font-weight:700"></p>
    </div>
  </div>

<section class="cod">
  <div class="wrap">
    <h2 id="codTitle"></h2>
    <p class="lead" id="codLead"></p>
    <div class="steps" id="steps"></div>
    <div class="note" id="codNote"></div>
  </div>
</section>

<section id="mediaSec">
  <div class="wrap center">
    <h2 id="mediaTitle"></h2>
    <div class="media" id="media"></div>
  </div>
</section>

<section id="vidSec" style="padding-top:0">
  <div class="wrap center">
    <h2 id="vidTitle"></h2>
    <p class="lead" id="vidLead"></p>
    <div class="vids" id="vids"></div>
    <p style="margin-top:26px"><a class="btn" id="ctaVid"></a></p>
  </div>
</section>

<section style="padding-top:0">
  <div class="wrap">
    <h2 id="fitTitle"></h2>
    <div class="fit">
      <div><ul id="fitList"></ul><div class="no" id="fitNo"></div></div>
      <div id="fitImg"></div>
    </div>
  </div>
</section>

<section class="kits" id="kits">
  <div class="wrap center">
    <h2 id="kitsTitle"></h2>
    <p class="lead" id="kitsLead"></p>
    <div class="kitgrid" id="kitgrid"></div>
  </div>
</section>

<section id="quoteSec">
  <div class="wrap">
    <h2 id="quoteTitle"></h2>
    <div class="quotes" id="quotes"></div>
  </div>
</section>

<section style="padding-top:0">
  <div class="wrap">
    <div class="guar center">
      <h2 id="guarTitle"></h2>
      <p class="lead" id="guarText"></p>
    </div>
  </div>
</section>

<section style="padding-top:0">
  <div class="wrap" style="max-width:760px">
    <h2>Perguntas frequentes</h2>
    <div id="faq"></div>
    <p class="center" style="margin-top:30px"><a class="btn" id="ctaFaq"></a></p>
  </div>
</section>

<section class="support" id="supportSec">
  <div class="wrap center">
    <h2 id="supportText"></h2>
    <a class="btn wa" id="supportBtn" target="_blank" rel="noopener"></a>
  </div>
</section>

<footer>
  <div class="wrap" id="footer"></div>
</footer>

<div class="sticky" id="sticky">
  <div class="t" id="stickyText"></div>
  <a class="btn" id="ctaSticky"></a>
</div>

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = v => CONFIG.moeda + " " + v.toFixed(2).replace(".", ",");

$("kitsLead").textContent = CONFIG.subKits;

  "<h3>" + esc(k.nome) + '</h3><div class="old">' + (k.precoDe > k.preco ? fmt(k.precoDe) : "") + '</div><div class="p">' + fmt(k.preco) +
  '</div><div class="pay">Pague só na entrega · Frete grátis</div><a class="btn" href="' + esc(k.link) + '">' + esc(CONFIG.botaoKit) + "</a></div>").join("");

if (CONFIG.depoimentos.length) {
  $("quoteTitle").textContent = CONFIG.tituloDepoimentos;
  $("quotes").innerHTML = CONFIG.depoimentos.map(d =>
    '<div class="quote"><p>“' + esc(d.texto) + "”</p><b>" + esc(d.nome) + " · " + esc(d.cidade) + "</b></div>").join("");
} else $("quoteSec").hidden = true;

$("guarTitle").textContent = CONFIG.tituloGarantia;
$("guarText").textContent = CONFIG.textoGarantia;
$("faq").innerHTML = CONFIG.perguntas.map(q => "<details><summary>" + esc(q.p) + "</summary><p>" + esc(q.r) + "</p></details>").join("");
$("footer").innerHTML = "<p>" + esc(CONFIG.rodape) + '</p><p style="margin-top:8px"><a href="' + esc(CONFIG.linkTermos) + '">Termos de Uso</a> · <a href="' + esc(CONFIG.linkPrivacidade) + '">Política de Privacidade</a></p>';

$("supportText").textContent = CONFIG.textoSuporte;
$("supportBtn").textContent = CONFIG.botaoSuporte;
$("supportBtn").href = "https://wa.me/" + CONFIG.whatsappSuporte + "?text=" + encodeURIComponent(CONFIG.mensagemSuporte);

// Esconde a barra fixa enquanto as ofertas estão na tela
new IntersectionObserver(e => $("sticky").hidden = e[0].isIntersecting).observe($("kits"));
</script>
</body>
</html>
